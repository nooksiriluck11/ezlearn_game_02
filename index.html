<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>กุกกุกกู๊ · kukkukkoo</title>
    <meta name="description" content="Memory &amp; focus, one phrase at a time." />
    <meta name="theme-color" content="#0E0B24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/fonts/prompt.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e0b24;
        color: #f4f1ff;
        font-family: 'Prompt', system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* The canvas parent is inset by the safe area rather than padded — the
         ScaleManager measures the parent box and ignores padding. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        touch-action: none;
      }

      #game canvas {
        display: block;
      }

      /* The native app was locked to portrait. A phone held sideways has no room
         for the board and the footer, so ask for the rotation instead of
         rendering a layout nobody can play. */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        background: #0e0b24;
      }

      #rotate .mark {
        font-size: 40px;
      }

      #rotate .headline {
        font-size: 17px;
        font-weight: 900;
        color: #ffd166;
      }

      #rotate .note {
        font-size: 13px;
        color: #9e97c9;
      }

      @media (orientation: landscape) and (max-height: 460px) {
        #rotate {
          display: flex;
        }
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #5eead4;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">kukkukkoo</div>
    <div id="rotate">
      <div class="mark">📱</div>
      <div class="headline">หมุนจอเป็นแนวตั้ง</div>
      <div class="note">กุกกุกกู๊ เล่นในแนวตั้งเท่านั้น · Turn your device upright to play</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
